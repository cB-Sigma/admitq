name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tools and everything the type checker needs to see
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff mypy
          python -m pip install redis prometheus-client opentelemetry-sdk tiktoken
          python -m pip install fastapi starlette litestar httpx uvicorn
          python -m pip install -e .
      - run: ruff check .
      - run: ruff format --check .
      - name: mypy --strict (library)
        run: mypy
      - name: mypy --strict (examples and benchmarks, against real framework types)
        run: mypy --strict examples benchmarks

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and every test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio hypothesis
          python -m pip install httpx uvicorn starlette fastapi litestar
          python -m pip install redis prometheus-client opentelemetry-sdk tiktoken
      - name: pytest
        run: pytest -rs
      - name: Examples that are tests
        run: pytest examples/tune_in_tests.py -q

  core-only:
    name: pytest without optional dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the package and only the test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio hypothesis
      - name: The core must import and pass with nothing else installed
        run: |
          python -c "import admitq, admitq.testing, admitq.signals, admitq.backends; print(admitq.__version__)"
          pytest -rs

  redis:
    name: Redis backend (real redis-server)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ADMITQ_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the package, the Redis client and the test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install redis pytest pytest-asyncio hypothesis
      - name: pytest (Redis tests must run, not skip)
        run: |
          pytest tests/test_redis.py -rs | tee redis-tests.log
          grep -Eq "(1[0-9]|[2-9][0-9]) passed" redis-tests.log

  build:
    name: build + twine check + clean install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: The wheel installs with zero dependencies
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install --no-deps dist/*.whl
          /tmp/clean/bin/python -m pip install dist/*.whl
          test "$(/tmp/clean/bin/python -m pip list --format=freeze | grep -vi '^pip==' | wc -l)" = "1"
          /tmp/clean/bin/python -c "import admitq; from admitq import InferenceAdmission, AdmissionController; print(admitq.__version__)"
