[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "admitq"
description = "Token-aware admission control, load shedding and tenant fairness for self-hosted LLM inference endpoints, as a pure-ASGI middleware."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "The admitq Authors" }]
keywords = [
  "asgi", "fastapi", "starlette", "litestar", "llm", "inference", "vllm", "llama.cpp",
  "admission-control", "load-shedding", "rate-limiting", "fair-queuing", "backpressure",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: WSGI :: Middleware",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
redis = ["redis>=5.0"]
tiktoken = ["tiktoken>=0.7"]
tokenizers = ["tokenizers>=0.15"]
prometheus = ["prometheus-client>=0.19"]
otel = ["opentelemetry-api>=1.20"]
all = [
  "redis>=5.0",
  "tiktoken>=0.7",
  "tokenizers>=0.15",
  "prometheus-client>=0.19",
  "opentelemetry-api>=1.20",
]
dev = [
  "ruff>=0.9",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.100",
  "httpx>=0.27",
  "uvicorn>=0.30",
  "starlette>=0.37",
  "fastapi>=0.110",
  "redis>=5.0",
  "prometheus-client>=0.19",
  "opentelemetry-sdk>=1.20",
  "tiktoken>=0.7",
  "build",
  "twine",
]

[project.urls]
Homepage = "https://github.com/cb-Sigma/admitq"
Documentation = "https://github.com/cb-Sigma/admitq/tree/main/docs"
Issues = "https://github.com/cb-Sigma/admitq/issues"
Changelog = "https://github.com/cb-Sigma/admitq/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/admitq/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/admitq"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "benchmarks", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
  "redis: needs a real redis-server (set ADMITQ_REDIS_URL or have redis-server on PATH)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Documentation code blocks are illustrative (some are deliberately not valid Python);
# keep the formatter to source files so results do not depend on the ruff version.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "PT", "ASYNC", "PERF"]
ignore = ["ASYNC109", "ASYNC110", "SIM108", "PERF401"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src/admitq"]

[[tool.mypy.overrides]]
module = ["tiktoken.*", "tokenizers.*", "redis.*", "prometheus_client.*", "opentelemetry.*"]
ignore_missing_imports = true
